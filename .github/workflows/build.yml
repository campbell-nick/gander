name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Build (${{ matrix.cc }})
        run: make clean && make CC=${{ matrix.cc }}

      - name: Version
        run: ./gander --version

      - name: Test
        run: make check

  # Experimental and allowed to fail: the embedded webview needs WebKitGTK,
  # which not every environment has. It only proves the opt-in build compiles.
  webview:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build with the embedded webview
        run: make clean && make WEBVIEW=1

      - name: Version
        run: ./gander --version

  # The Qt Web Engine backend, used when GTK is not wanted. Also experimental.
  webview-qt:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt Web Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-webengine-dev

      - name: Build with the Qt webview
        run: make clean && make WEBVIEW=qt

      - name: Version
        run: ./gander --version
